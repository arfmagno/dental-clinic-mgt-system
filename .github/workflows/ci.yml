# Every push to master and every pull request: lint, typecheck, unit tests, then end-to-end tests.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The desktop tests only need Node; skip the ~100 MB Electron download on Linux.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Coverage (web logic layers; fails below the thresholds in vitest.config.ts)
        run: npm run coverage
      - name: Demo build (static, no server)
        run: npm run build:demo

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run e2e
        env:
          E2E_CHANNEL: chromium # Edge is the local default; CI uses Playwright's Chromium
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e/.results
          retention-days: 7

  lighthouse:
    name: Lighthouse (performance, accessibility, best practices, SEO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Audit the production build (fails below the floors in scripts/lighthouse.mjs)
        run: npm run lighthouse
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse
          retention-days: 14
